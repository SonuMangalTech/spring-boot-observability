spring.application.name=spring-boot-observability

# Expose Actuator endpoints over HTTP
# Without exposing the prometheus endpoint, Prometheus won't be able to scrape your application through the standard endpoint.
management.endpoints.web.exposure.include=health,info,metrics,prometheus

# Show health details (use appropriate security in production)
management.endpoint.health.show-details=always

# Add application name as a metric label
management.metrics.tags.application=${spring.application.name}