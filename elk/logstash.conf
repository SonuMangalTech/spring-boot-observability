input {
  file {
    path => "/usr/share/logstash/logs/spring-boot-observability.log"
    start_position => "beginning"
    sincedb_path => "/dev/null"
  }
}

output {

  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "spring-logs"
  }

  stdout {
    codec => rubydebug
  }
}